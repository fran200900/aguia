        .wa-header {

        .wa-header .fa-whatsapp {

            border: none;

            height: 32px;

            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 14.5px;

            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
        }

        .wa-btn:hover {
            background: linear-gradient(135deg, #0d9488, #0f766e);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(20, 184, 166, 0.4);
        }

        .wa-btn:active {

        /* Miniatura moderna */

            background: linear-gradient(145deg, #0f172a, #1e293b);

            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(45, 212, 191, 0.5);
        }

        .wa-mini.hidden {

        }

        .wa-mini i {
            font-size: 24px;
            color: #2dd4bf;

        /* Menu Deslizante */
        .menu {
            position: fixed;
            top: 0;
            right: -50%;
            width: 50%;

        allow="clipboard-read; clipboard-write"
        title="app.aguiaoficial.com">
    </iframe>

    <!-- Container do Banner Recuável e Miniatura -->
    <div class="wa-container">
        <!-- Banner Aberto -->
        <div class="wa-card" id="wa-card">
            <div class="wa-header">
                <i class="fab fa-whatsapp"></i>
                <button id="wa-minimize" class="wa-minimize" aria-label="Minimizar">&times;</button>
            </div>
            <p class="wa-title">Grupo de palpites<br>no WhatsApp</p>
            <a href="https://chat.whatsapp.com/CaY60otbPRkEJL0n5Hhnvm" target="_blank" class="wa-btn">
                Entrar no Grupo
            </a>
        </div>
        
        <!-- Miniatura -->
        <div id="wa-mini" class="wa-mini hidden" title="Abrir opções do WhatsApp">
            <i class="fas fa-users"></i>
        </div>
    </div>

    <script>
        // Abrir em tela cheia automaticamente
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.querySelector('iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) {
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const bannerContainer = document.getElementById('banner-container');
            const closeBanner = document.getElementById('close-banner');

            // Mostra o banner superacertos.png após 3 segundos
            setTimeout(() => {
                bannerContainer.style.display = 'flex';
            }, 3000);

            // Fecha o banner
            if (closeBanner) {
                closeBanner.addEventListener('click', (e) => {
                    e.stopPropagation(); // Impede que o clique no X abra o link
                    bannerContainer.style.display = 'none';
                });
            }

            // Lógica do Banner WhatsApp
            const waCard = document.getElementById('wa-card');
            const waMinimize = document.getElementById('wa-minimize');
            const waMini = document.getElementById('wa-mini');

            if (waMinimize && waCard && waMini) {
                waMinimize.addEventListener('click', () => {
                    waCard.classList.add('hidden');
                    waMini.classList.remove('hidden');
                });
                
                waMini.addEventListener('click', () => {
                    waMini.classList.add('hidden');
                    waCard.classList.remove('hidden');
                });
            }
        });
    </script>
