    <style>
        * {

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #171717;
            font-family: Arial, sans-serif;
        }

        /* APLICATIVO EM TELA INTEIRA */

        #app-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border: 0;
            display: block;
            background: #171717;

        /* WHATSAPP */

        .wa-container {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }

        .wa-card {
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
            padding: 18px 20px;
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .wa-card.hidden,
        .wa-mini.hidden {
            display: none !important;
        }

        .wa-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wa-icon {
            width: 42px;
            height: 42px;
            color: #2dd4bf;
        }

        .wa-minimize {
            background: rgba(255,255,255,.08);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            color: #fff;
            cursor: pointer;
        }

        .wa-title {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            margin: 0;
            line-height: 1.5;
        }

        .wa-btn {
            background: linear-gradient(135deg, #14b8a6, #0d9488);
            color: #fff;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            transition: .2s;
        }

        .wa-btn:hover {
            transform: translateY(-2px);
        }

        .wa-mini {
            background: #0f172a;
            border-radius: 16px;
            width: 56px;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 24px rgba(0,0,0,.3);
            cursor: pointer;
            border: 1px solid #2dd4bf;
            color: #2dd4bf;
        }

        .wa-mini svg {
            width: 27px;
            height: 27px;
        }

        /* BANNER DE BOAS-VINDAS */

        #banner-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        #banner {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        #banner a {
            display: block;
        }

        #banner img {
            display: block;
            max-width: 100%;
            max-height: 85vh;
            max-height: 85dvh;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
        }

        #close-banner {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #fff;
            color: #333;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* CELULAR */

            }

            #close-banner {

                height: 36px;
                top: -12px;
                right: -10px;

    <!-- SCRIPTS -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            // BANNER PROMOCIONAL
            const bannerContainer = document.getElementById('banner-container');
            const closeBanner = document.getElementById('close-banner');

            // Exibe o banner após 3 segundos
            setTimeout(function () {
                bannerContainer.style.display = 'flex';
            }, 3000);

            // Fecha o banner
            closeBanner.addEventListener('click', function () {
                bannerContainer.style.display = 'none';
            });

            // Fecha com ESC
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    bannerContainer.style.display = 'none';
                }
            });

            // WHATSAPP
            const waCard = document.getElementById('wa-card');
            const waMinimize = document.getElementById('wa-minimize');
            const waMini = document.getElementById('wa-mini');

            waMinimize.addEventListener('click', function () {
                waCard.classList.add('hidden');
                waMini.classList.remove('hidden');
            });

            waMini.addEventListener('click', function () {
                waMini.classList.add('hidden');
                waCard.classList.remove('hidden');
            });

        });
    </script>
